<!doctype html><body><pre id=o></pre><script>
var p=new URLSearchParams(location.search).get('p'),ws=(new URLSearchParams(location.search).get("w")||"1280,980,390").split(",").map(Number),out=[];
ws.forEach(function(w){var f=document.createElement('iframe');f.style.cssText='width:'+w+'px;height:900px;border:0';f.src=p;document.body.appendChild(f);
f.onload=function(){setTimeout(function(){out.push(w+':'+f.contentDocument.documentElement.scrollHeight);document.getElementById('o').textContent=out.join(' ');},1500)}});
</script>
